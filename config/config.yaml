project:
  organization: ZXSPRD.COM
  environment: Production
  scanner_name: InfraScanner
  timezone: Asia/Dubai

scanner:
  version: "1.0.1"
  config_version: "1.0.1"

reporting:
  organization_name: My Company
  report_author: InfraScanner
  classification: Internal
  formats:
  - html
  - csv
  - pdf
  - json
  package_zip: true
  executive_pdf: true
  technical_pdf: true
  change_report: true
networks:
- name: MGMT
  subnet: 192.168.4.0/24
- name: DMZ
  subnet: 192.168.1.0/24
exclude:
  hosts: []
  subnets: []
scan:
  profile: standard
  maintenance_window:
    enabled: false
    start: '22:00'
    end: 06:00
  resume_enabled: true
scan_profiles:
  quick:
    top_ports: 100
    full_ports: false
    udp_top100: false
    os_detection: false
    version_detection: true
    nse_default: false
    timing: aggressive
  standard:
    top_ports: 1000
    full_ports: false
    udp_top100: false
    os_detection: true
    version_detection: true
    nse_default: true
    timing: normal
  deep:
    top_ports: 1000
    full_ports: true
    udp_top100: false
    os_detection: true
    version_detection: true
    nse_default: true
    timing: normal
  extreme:
    top_ports: 1000
    full_ports: true
    udp_top100: true
    os_detection: true
    version_detection: true
    nse_default: true
    version_intensity: 9
    timing: aggressive
performance:
  max_parallel_hosts: 8
  packet_rate: ''
  host_timeout: 15m
  script_timeout: 60s
  retries: 1
  min_rtt_timeout: 200ms
  discovery_parallelism: '300'
email:
  enabled: true
  smtp_server: smtp.example.com
  smtp_port: 587
  use_tls: true
  username: scanner@example.com
  password: CHANGE_ME
  sender: InfraScanner <scanner@example.com>
  recipients:
  - abc@def.com
  subject_prefix: '[Infrastructure Scan]'
  alert_subject_prefix: '[ALERT]'
  critical_severity_alert: true
teams:
  enabled: true
  webhook_url: https://teams.webhook.example.com/hook
  events:
  - scan_started
  - scan_completed
  - report_sent
  - error
  - changes_detected
notifications:
  slack:
    enabled: false
    webhook_url: ''
  telegram:
    enabled: false
    bot_token: ''
    chat_id: ''
severity_rules:
  rdp_in_dmz: CRITICAL
  exposed_database_in_dmz: CRITICAL
  smbv1: HIGH
  open_database: HIGH
  expired_ssl: MEDIUM
  ssl_self_signed: MEDIUM
  http_exposed: LOW
  unknown_device: INFO
retention:
  scan_days: 90
  report_days: 90
  monthly_keep: 12
  config_backups: 20
logging:
  level: INFO
  verbose_debug: false
  max_bytes: 5242880
  backup_count: 5
paths:
  scans_dir: scans
  reports_dir: reports
  logs_dir: logs
  temp_dir: temp
